    <linearGradient id="moon" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9db4ff"/>
      <stop offset="0.55" stop-color="#6f86f5"/>
      <stop offset="1" stop-color="#4552c9"/>
