<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3355"/>
      <stop offset="0.55" stop-color="#181d33"/>
      <stop offset="1" stop-color="#0a0c18"/>
